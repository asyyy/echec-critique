name: Release

# Pousser un tag de version (ex. v0.2.0) publie une Release GitHub avec l'APK Android signé
# et le lien vers la version web (iPhone, ordinateur).
on:
  push:
    tags: ['v*.*.*']

permissions:
  contents: write

jobs:
  create-release:
    runs-on: ubuntu-latest
    outputs:
      release_id: ${{ steps.release.outputs.id }}
      version: ${{ steps.version.outputs.version }}
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      # La version vient de package.json : le tag doit lui correspondre
      - name: Vérifier que le tag correspond à package.json
        id: version
        run: |
          version="${GITHUB_REF_NAME#v}"
          pkg="$(node -p "require('./package.json').version")"
          if [ "$version" != "$pkg" ]; then
            echo "::error::Le tag $GITHUB_REF_NAME ne correspond pas à package.json ($pkg). Lance « npm version $version » avant de taguer."
            exit 1
          fi
          echo "version=$version" >> "$GITHUB_OUTPUT"

      - name: Créer la Release
        id: release
        uses: softprops/action-gh-release@v2
        with:
          name: Échec Critique ${{ github.ref_name }}
          body: |
            ## Installer Échec Critique

            - **Android** : télécharge `echec-critique-${{ steps.version.outputs.version }}.apk` ci-dessous et ouvre-le (autoriser l'installation depuis des sources inconnues).
            - **iPhone / iPad** : ouvre [la version web](https://asyyy.github.io/echec-critique/) dans Safari → Partager → « Sur l'écran d'accueil ».
            - **Ordinateur** : ouvre [la version web](https://asyyy.github.io/echec-critique/) dans Chrome ou Edge → icône « Installer » dans la barre d'adresse.

          generate_release_notes: true

  android:
    needs: create-release
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version-file: .nvmrc
          cache: npm

      - name: Setup Java
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 21

      - name: Install
        run: npm ci

      - name: Build web + copie dans le projet Android
        run: npm run android:sync

      # Secrets du dépôt : ANDROID_KEYSTORE_BASE64, ANDROID_KEYSTORE_PASSWORD, ANDROID_KEY_ALIAS, ANDROID_KEY_PASSWORD
      - name: Clé de signature
        env:
          KEYSTORE_BASE64: ${{ secrets.ANDROID_KEYSTORE_BASE64 }}
        run: |
          if [ -z "$KEYSTORE_BASE64" ]; then
            echo "::error::Secret ANDROID_KEYSTORE_BASE64 manquant : impossible de signer l'APK."
            exit 1
          fi
          echo "$KEYSTORE_BASE64" | base64 --decode > "$RUNNER_TEMP/release.jks"
          echo "ANDROID_KEYSTORE_PATH=$RUNNER_TEMP/release.jks" >> "$GITHUB_ENV"

      # versionCode croissant dérivé de la version : 1.2.3 → 10203
      - name: Build APK signé
        working-directory: android
        env:
          ANDROID_KEYSTORE_PASSWORD: ${{ secrets.ANDROID_KEYSTORE_PASSWORD }}
          ANDROID_KEY_ALIAS: ${{ secrets.ANDROID_KEY_ALIAS }}
          ANDROID_KEY_PASSWORD: ${{ secrets.ANDROID_KEY_PASSWORD }}
          VERSION: ${{ needs.create-release.outputs.version }}
        run: |
          IFS=. read -r major minor patch <<< "$VERSION"
          export ANDROID_VERSION_NAME="$VERSION"
          export ANDROID_VERSION_CODE=$((major * 10000 + minor * 100 + patch))
          chmod +x gradlew
          ./gradlew assembleRelease
          cp app/build/outputs/apk/release/app-release.apk "$RUNNER_TEMP/echec-critique-$VERSION.apk"

      - name: Joindre l'APK à la Release
        env:
          GH_TOKEN: ${{ github.token }}
        run: gh release upload "$GITHUB_REF_NAME" "$RUNNER_TEMP/echec-critique-${{ needs.create-release.outputs.version }}.apk" --clobber

